<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Learning App - English to Bengali</title>
    <!-- Import elegant fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #fdf5f6; /* Soft blush pink */
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-dark: #4a3b4e; /* Deep lavender-grey */
            --accent-pink: #f48fb1;
            --accent-lavender: #ce93d8;
            --accent-mint: #a5d6a7;
            --btn-text: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e8f5e9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            overflow: hidden; /* For floating petals */
            position: relative;
        }

        /* Ambient Floral Background Decorations */
        .floral-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, #ffbcf2, #ff8fb1);
            border-radius: 50% 0 50% 50%;
            opacity: 0.6;
            animation: float 15s infinite linear;
        }

        .petal:nth-child(1) { width: 30px; height: 30px; left: 10%; animation-duration: 12s; }
        .petal:nth-child(2) { width: 40px; height: 40px; left: 30%; animation-duration: 18s; animation-delay: 2s; background: radial-gradient(circle at 30% 30%, #e1bee7, #ce93d8); border-radius: 50% 50% 0 50%; }
        .petal:nth-child(3) { width: 25px; height: 25px; left: 60%; animation-duration: 14s; animation-delay: 5s; }
        .petal:nth-child(4) { width: 35px; height: 35px; left: 80%; animation-duration: 16s; animation-delay: 1s; background: radial-gradient(circle at 30% 30%, #fff9c4, #ffe082); border-radius: 0 50% 50% 50%; }
        .petal:nth-child(5) { width: 20px; height: 20px; left: 90%; animation-duration: 10s; animation-delay: 4s; }

        @keyframes float {
            0% { transform: translateY(-50px) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(110vh) rotate(360deg) translateX(50px); opacity: 0; }
        }

        /* Main App Container (Glassmorphism) */
        .app-container {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px 30px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05), inset 0 0 15px rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        /* Typography */
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #c2185b; /* Deep rose */
            margin-bottom: 5px;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #7b1fa2;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Category Selector */
        select {
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 30px;
            border-radius: 25px;
            border: 2px solid rgba(244, 143, 177, 0.5);
            background: rgba(255, 255, 255, 0.7);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            color: var(--text-dark);
            outline: none;
            cursor: pointer;
            appearance: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: var(--accent-lavender);
            box-shadow: 0 4px 15px rgba(206, 147, 216, 0.3);
        }

        /* Flashcard Area (3D Flip) */
        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 220px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 20px;
        }

        .card-front {
            border-bottom: 5px solid var(--accent-pink);
        }

        .card-back {
            transform: rotateY(180deg);
            border-bottom: 5px solid var(--accent-lavender);
        }

        .word-en {
            font-size: 2.2rem;
            font-weight: 600;
            color: #d81b60;
        }

        .word-bn {
            font-size: 2.5rem;
            font-weight: 600;
            color: #6a1b9a;
            margin-bottom: 10px;
        }

        .pronunciation {
            font-size: 1.1rem;
            color: #888;
            font-style: italic;
        }

        .hint {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 15px;
            opacity: 0.7;
        }

        /* Navigation Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        button {
            flex: 1;
            padding: 12px 0;
            border-radius: 30px;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--btn-text);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        #prev-btn {
            background: linear-gradient(45deg, #b39ddb, #ce93d8);
        }

        #next-btn {
            background: linear-gradient(45deg, #f48fb1, #ffb74d);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        #prev-btn:hover { background: linear-gradient(45deg, #9575cd, #ba68c8); }
        #next-btn:hover { background: linear-gradient(45deg, #e91e63, #ffa726); }

        button:active {
            transform: translateY(1px);
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .app-container { padding: 30px 20px; }
            h1 { font-size: 2.5rem; }
            .word-en { font-size: 1.8rem; }
            .word-bn { font-size: 2rem; }
            .flashcard-wrapper { height: 190px; }
        }
    </style>
</head>
<body>

    <!-- Floral Floating Background Elements -->
    <div class="floral-bg">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
    </div>

    <!-- Main Glass App Interface -->
    <div class="app-container">
        <h1>Blossom Lingo</h1>
        <div class="subtitle">Bloom into a new language</div>

        <select id="category-select">
            <!-- Options populated by JS -->
        </select>

        <div class="flashcard-wrapper" id="flashcard-container">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="word-en" id="english-word">Loading...</div>
                    <div class="hint">Tap to flip</div>
                </div>
                <div class="card-face card-back">
                    <div class="word-bn" id="bengali-word">লোড হচ্ছে...</div>
                    <div class="pronunciation" id="pronunciation">...</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn">❮ Previous</button>
            <button id="next-btn">Next ❯</button>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // MOCK DATABASE: Categorized English to Bengali Vocabulary
        const dictionaryData = {
            "Daily Conversations": [
                { en: "Hello", bn: "নমস্কার", pron: "Nomoshkar" },
                { en: "How are you?", bn: "কেমন আছো?", pron: "Kemon acho?" },
                { en: "Thank you", bn: "ধন্যবাদ", pron: "Dhonnobad" },
                { en: "Good morning", bn: "সুপ্রভাত", pron: "šuprobhat" },
                { en: "I am studying", bn: "আমি পড়াশোনা করছি", pron: "Ami porashona korchi" },
                { en: "Water", bn: "জল", pron: "Jol" },
                { en: "Food", bn: "খাবার", pron: "Khabar" },
                { en: "Time", bn: "সময়", pron: "Shomoy" },
                { en: "Goal", bn: "লক্ষ্য", pron: "Lokkho" },
                { en: "Family", bn: "পরিবার", pron: "Poribar" },
                { en: "Scooter / Bike", bn: "মোটরসাইকেল", pron: "Motor-cycle" }
            ],
            "Medical & Biology": [
                { en: "Doctor", bn: "ডাক্তার", pron: "Daktar" },
                { en: "Hospital", bn: "হাসপাতাল", pron: "Hashpatal" },
                { en: "Medicine", bn: "ওষুধ", pron: "Oshudh" },
                { en: "Heart", bn: "হৃদয়", pron: "Hridoy" },
                { en: "Brain", bn: "মস্তিষ্ক", pron: "Mostisko" },
                { en: "Blood", bn: "রক্ত", pron: "Rokto" },
                { en: "Cell", bn: "কোষ", pron: "Kosh" },
                { en: "Disease", bn: "রোগ", pron: "Rog" },
                { en: "Patient", bn: "রোগী", pron: "Rogi" },
                { en: "Health", bn: "স্বাস্থ্য", pron: "Shastho" },
                { en: "Skeleton", bn: "কঙ্কাল", pron: "Kongkal" }
            ],
            "Romance & Relationships": [
                { en: "Love", bn: "ভালোবাসা", pron: "Bhalobasha" },
                { en: "Beautiful", bn: "সুন্দর", pron: "Shundor" },
                { en: "Anniversary", bn: "বার্ষিকী", pron: "Barshiki" },
                { en: "Forever", bn: "চিরকাল", pron: "Chirokal" },
                { en: "Together", bn: "একসাথে", pron: "Ekshathe" },
                { en: "Promise", bn: "প্রতিশ্রুতি", pron: "Protishruti" },
                { en: "Soulmate", bn: "প্রাণের সাথী", pron: "Praner shathi" },
                { en: "Gift", bn: "উপহার", pron: "Upohar" }
            ]
        };

        // State Variables
        let currentCategory = "Daily Conversations";
        let currentIndex = 0;
        let isFlipped = false;

        // DOM Elements
        const categorySelect = document.getElementById('category-select');
        const flashcardContainer = document.getElementById('flashcard-container');
        const flashcard = document.getElementById('flashcard');
        const englishWordEl = document.getElementById('english-word');
        const bengaliWordEl = document.getElementById('bengali-word');
        const pronunciationEl = document.getElementById('pronunciation');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Initialize Application
        function initApp() {
            // Populate Dropdown
            Object.keys(dictionaryData).forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });

            updateCardContent();
        }

        // Update Flashcard Data
        function updateCardContent() {
            const currentList = dictionaryData[currentCategory];
            const wordData = currentList[currentIndex];

            // Reset flip state if flipped
            if (isFlipped) {
                flashcard.classList.remove('flipped');
                isFlipped = false;
                
                // Wait for animation to finish before changing text
                setTimeout(() => {
                    setCardText(wordData);
                }, 400); 
            } else {
                setCardText(wordData);
            }
        }

        function setCardText(wordData) {
            englishWordEl.textContent = wordData.en;
            bengaliWordEl.textContent = wordData.bn;
            pronunciationEl.textContent = `[ ${wordData.pron} ]`;
        }

        // Event Listeners
        
        // Flip Card
        flashcardContainer.addEventListener('click', () => {
            isFlipped = !isFlipped;
            flashcard.classList.toggle('flipped');
        });

        // Change Category
        categorySelect.addEventListener('change', (e) => {
            currentCategory = e.target.value;
            currentIndex = 0; // Reset index when category changes
            updateCardContent();
        });

        // Next Word
        nextBtn.addEventListener('click', () => {
            const listLength = dictionaryData[currentCategory].length;
            currentIndex = (currentIndex + 1) % listLength; // Loop back to start
            updateCardContent();
        });

        // Previous Word
        prevBtn.addEventListener('click', () => {
            const listLength = dictionaryData[currentCategory].length;
            currentIndex = (currentIndex - 1 + listLength) % listLength; // Loop to end
            updateCardContent();
        });

        // Run Init
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
